server {
    listen 9000;
    server_name www.voyagevibes.in;

    return 308 https://$host:9001$request_uri;
}

server {
    listen 9000;
    server_name localhost 127.0.0.1;

    root /opt/app-root/src;
    index index.html;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:9000 https://localhost:9001 http://www.voyagevibes.in:9000 https://www.voyagevibes.in:9001 http://voyagevibes.in:9000 https://voyagevibes.in:9001 http://customer-ui.voyagevibes.in:9000 https://customer-ui.voyagevibes.in:9001 ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /gateway-api/ {

        rewrite ^/gateway-api/(.*)$ /$1 break;

        proxy_pass http://kong-gateway:8000;

        proxy_set_header Host localhost;
        proxy_set_header Origin "";
    }

    location /api/ {

        proxy_pass http://kong-gateway:8000;

        proxy_set_header Host localhost;
        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 9001 ssl;
    server_name customer-ui.voyagevibes.in localhost 127.0.0.1;

    root /opt/app-root/src;
    index index.html;

    ssl_certificate /etc/nginx/certs/www.voyagevibes.in.crt.pem;
    ssl_certificate_key /etc/nginx/certs/www.voyagevibes.in.key.pem;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:9000 https://localhost:9001 http://www.voyagevibes.in:9000 https://www.voyagevibes.in:9001 http://voyagevibes.in:9000 https://voyagevibes.in:9001 http://customer-ui.voyagevibes.in:9000 https://customer-ui.voyagevibes.in:9001 ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /gateway-api/ {

        rewrite ^/gateway-api/(.*)$ /$1 break;

        proxy_pass http://kong-gateway:8000;

        proxy_set_header Host localhost;
        proxy_set_header Origin "";
    }

    location /api/ {

        proxy_pass http://kong-gateway:8000;

        proxy_set_header Host localhost;
        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
