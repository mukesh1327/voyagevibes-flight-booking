services:

  kong-postgres-init:
    image: registry.redhat.io/rhel9/postgresql-16:latest
    container_name: kong-postgres-init
    restart: "no"
    env_file:
      - ./.env
    command: >
      sh -ec "
        until pg_isready -h platform-postgres -U $$POSTGRESQL_USER -d $$POSTGRESQL_DATABASE; do sleep 2; done;
        psql -h platform-postgres -U $$POSTGRESQL_USER -d $$POSTGRESQL_DATABASE -v ON_ERROR_STOP=1 -f /init/db-init.sql
      "
    depends_on:
      platform-postgres:
        condition: service_healthy
    volumes:
      - ./init-db:/init:ro,Z
    networks:
      - flight-booking-network

  kong-migrations:
    container_name: kong-migrations
    image: docker.io/library/kong
    command:
      - /bin/sh
      - -ec
      - |
        # Bootstrap is idempotent but does not apply newly added migrations to
        # an existing database. Finish interrupted migrations before applying
        # newly available migrations, then finalize the new schema.
        kong migrations bootstrap --vv || true
        kong migrations finish --vv || true
        kong migrations up --vv
        kong migrations finish --vv
    env_file:
      - ./.env
    volumes:
      - ./ssl-certs:/etc/kong/certs:ro,Z
    depends_on:
      platform-postgres:
        condition: service_healthy
      kong-postgres-init:
        condition: service_completed_successfully
    networks:
      - flight-booking-network

# -----------

  kong-gateway:
    image: docker.io/library/kong
    container_name: kong-gateway
    env_file:
      - ./.env
    ports:
      - "8000:8000"  # Proxy (your services entrypoint)
      - "8444:8443"  # HTTPS (remapped from 8443 to avoid host port conflict)
      - "8001:8001"  # Admin API
    volumes:
      - ./ssl-certs:/etc/kong/certs:ro,Z
    depends_on:
      platform-postgres:
        condition: service_healthy
      kong-postgres-init:
        condition: service_completed_successfully
      kong-migrations:
        condition: service_completed_successfully
    networks:
      - flight-booking-network

  kong-routes-init:
    container_name: kong-routes-init
    image: registry.redhat.io/openshift4/network-tools-rhel9:v4.19
    restart: "no"
    command: ["/bin/bash", "/opt/bootstrap/register-kong-routes.sh"]
    environment:
      KONG_ADMIN_BASE_URL: http://kong-gateway:8001
      AUTH_SERVICE_RUNTIME: ${AUTH_SERVICE_RUNTIME:-production}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-}
      AUTH_SERVICE_DEV_URL: ${AUTH_SERVICE_DEV_URL:-http://host.containers.internal:8081/auth}
      AUTH_SERVICE_PROD_URL: ${AUTH_SERVICE_PROD_URL:-http://auth-service:8081/auth}
      FLIGHT_SERVICE_URL: ${FLIGHT_SERVICE_URL:-}
      FLIGHT_SERVICE_DEV_URL: ${FLIGHT_SERVICE_DEV_URL:-http://host.containers.internal:8083/flights}
      FLIGHT_SERVICE_PROD_URL: ${FLIGHT_SERVICE_PROD_URL:-http://flight-service:8083/flights}
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-}
      BOOKING_SERVICE_DEV_URL: ${BOOKING_SERVICE_DEV_URL:-http://host.containers.internal:8084/bookings}
      BOOKING_SERVICE_PROD_URL: ${BOOKING_SERVICE_PROD_URL:-http://booking-service:8084/bookings}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-}
      PAYMENT_SERVICE_DEV_URL: ${PAYMENT_SERVICE_DEV_URL:-http://host.containers.internal:8085/payments}
      PAYMENT_SERVICE_PROD_URL: ${PAYMENT_SERVICE_PROD_URL:-http://payment-service:8085/payments}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-}
      NOTIFICATION_SERVICE_DEV_URL: ${NOTIFICATION_SERVICE_DEV_URL:-http://host.containers.internal:8086/notifications}
      NOTIFICATION_SERVICE_PROD_URL: ${NOTIFICATION_SERVICE_PROD_URL:-http://notification-service:8086/notifications}
    depends_on:
      kong-gateway:
        condition: service_started
    volumes:
      - ./api-init/register-kong-routes.sh:/opt/bootstrap/register-kong-routes.sh:ro,Z
    networks:
      - flight-booking-network

# ================= Network ========================

networks:
  flight-booking-network:
    name: flight-booking-network
    driver: bridge
