services:

# OpenTelemetry Collector service
  opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ${MAKARA_OTEL_CONFIG_FILE:-./config/otel-collector-config.yml}:/etc/otel-collector-config.yml:ro,Z
      - nginx_logs:/var/log/nginx:ro
      - ${MAKARA_OTEL_CERT_DIR:-/tmp/makara-otel-certs}:/etc/makara/otel-certs:ro,Z
    environment:
      MAKARA_OTEL_GATEWAY_OTLP_HTTP_ENDPOINT: ${MAKARA_OTEL_GATEWAY_OTLP_HTTP_ENDPOINT:-http://host.containers.internal:4324}
      MAKARA_SERVICE_TOKEN: ${MAKARA_SERVICE_TOKEN:-local-only-service-token-change-me}
      MAKARA_TENANT_ID: ${MAKARA_TENANT_ID:-tenant_local}
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4301:4317" # OTLP gRPC
      - "4302:4318" # OTLP HTTP
      - "8881:8888" # Collector metrics
      - "8882:8889" # Prometheus exporter
    networks:
      - flight-booking-network
      - makara-observer-local

networks:
  flight-booking-network:
    name: flight-booking-network
    driver: bridge
  makara-observer-local:
    external: true

volumes:
  nginx_logs:
