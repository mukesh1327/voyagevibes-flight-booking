extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  # Dual-export to Makara's telemetry-platform ingestion gateway, additive
  # alongside the existing Tempo/Loki/Prometheus pipeline above -- this app's
  # own observability stack is unchanged and remains the source of truth for
  # its own dashboards. See makara-telemetry-platform/ and
  # references/docs/architecture/telemetry-platform-design.md (TEL-002).
  otlp_http/makara:
    endpoint: http://otel-gateway:4318
    headers:
      Authorization: Bearer ${env:MAKARA_INGEST_TOKEN}

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp_http/tempo
        - otlp_http/makara
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus
        - otlp_http/makara
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlp_http/loki
        - otlp_http/makara
